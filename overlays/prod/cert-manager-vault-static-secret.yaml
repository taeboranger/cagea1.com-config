apiVersion: v1
kind: ServiceAccount
metadata:
  name: cagea1-vault-auth
  namespace: cert-manager
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cagea1-vault-auth
  namespace: cert-manager
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator-system/cagea1-vault
  kubernetes:
    role: cagea1-vso
    serviceAccount: cagea1-vault-auth
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  type: kv-v2
  mount: kv
  path: cagea1-com-prod-secret
  refreshAfter: 1h
  vaultAuthRef: cagea1-vault-auth
  destination:
    create: true
    overwrite: true
    name: cloudflare-api-token
    transformation:
      excludes:
        - ".*"
      templates:
        api-token:
          text: '{{ get .Secrets "cloudflare-api-token" }}'
