{
  "apiVersion": "secrets.hashicorp.com/v1beta1",
  "kind": "VaultStaticSecret",
  "metadata": {
    "name": "grafana-runtime",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-1"
    }
  },
  "spec": {
    "type": "kv-v2",
    "mount": "kv",
    "path": "waf-observability/grafana",
    "vaultAuthRef": "grafana-vault-auth",
    "refreshAfter": "60s",
    "destination": {
      "create": true,
      "name": "grafana-runtime",
      "transformation": {
        "excludeRaw": true
      }
    }
  }
}
