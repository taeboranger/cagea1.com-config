{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "Ingress",
  "metadata": {
    "name": "bunkerweb-ui",
    "annotations": {
      "nginx.ingress.kubernetes.io/backend-protocol": "HTTPS",
      "nginx.ingress.kubernetes.io/proxy-ssl-name": "bunkerweb.cagea1.com",
      "nginx.ingress.kubernetes.io/proxy-ssl-server-name": "on"
    }
  },
  "spec": {
    "ingressClassName": "nginx",
    "tls": [
      {
        "hosts": [
          "bunkerweb.cagea1.com"
        ],
        "secretName": "bunkerweb-tls"
      }
    ],
    "rules": [
      {
        "host": "bunkerweb.cagea1.com",
        "http": {
          "paths": [
            {
              "path": "/",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "bunkerweb",
                  "port": {
                    "number": 443
                  }
                }
              }
            }
          ]
        }
      }
    ]
  }
}
