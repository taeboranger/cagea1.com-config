apiVersion: apps/v1
kind: Deployment
metadata:
  name: cagea1-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cagea1
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cagea1
    spec:
      imagePullSecrets:
        - name: github-container-registry
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: prepare-upload-directory
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /data/uploads && chown -R 1001:1001 /data"]
          volumeMounts:
            - name: application-data
              mountPath: /data
      containers:
        - name: cagea1
          image: ghcr.io/taeboranger/cagea1.com
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cagea1-secret
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
          volumeMounts:
            - name: application-data
              mountPath: /app/data
            - name: application-data
              mountPath: /app/public/uploads
              subPath: uploads
      volumes:
        - name: application-data
          persistentVolumeClaim:
            claimName: cagea1-data
